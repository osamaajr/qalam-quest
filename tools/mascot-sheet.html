<!doctype html><meta charset="utf-8"><title>Mascot sheet</title>
<link rel="stylesheet" href="../css/mascot.css">
<style>body{font-family:sans-serif;background:#f6f7fb;margin:0;padding:16px}body.dark{background:#131A2B;color:#ccd}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.c{background:rgba(255,255,255,.7);border-radius:12px;text-align:center;font-size:12px;padding:6px}.dark .c{background:#1E2740}.c .kid{width:100%;height:210px}</style>
<div class="g" id="g"></div>
<script src="../js/mascot.js"></script>
<script>const q=new URLSearchParams(location.search);if(q.get('dark'))document.body.classList.add('dark');
const moods=(q.get('moods')||'idle,wave,happy,talk,sad,think,cheeky,dance,walk,read,point,sit,sleep').split(',');
document.getElementById('g').innerHTML=(q.get('b')||'zaid,huda').split(',').map(b=>moods.map(m=>`<div class="c">${QQ_MASCOT.kid(b,m)}${b} · ${m}</div>`).join('')).join('');</script>
