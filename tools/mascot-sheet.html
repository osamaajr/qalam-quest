<!doctype html><meta charset="utf-8"><title>Mascot sheet</title>
<link rel="stylesheet" href="../css/mascot.css">
<style>body{font-family:sans-serif;background:#f6f7fb;margin:0;padding:16px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.c{background:#fff;border-radius:12px;text-align:center;font-size:12px;padding:6px}.c .kid:not(.head-only){display:block;width:120px;margin:0 auto}</style>
<div id="heads" style="display:flex;gap:16px;margin-bottom:16px"></div>
<div class="g" id="g"></div>
<script src="../js/mascot.js"></script>
<script>const moods=['idle','wave','happy','talk','sad','think','cheeky','dance','walk','read','point','sit'];
document.getElementById('heads').innerHTML=['zaid','huda'].map(b=>`<div class="c"><div style="width:72px;height:72px;margin:auto;border-radius:50%;background:#e8eeff;overflow:hidden">${QQ_MASCOT.kid(b,'idle','',{headOnly:true})}</div>${b} · avatar</div>`).join('');
document.getElementById('g').innerHTML=['zaid','huda'].map(b=>moods.map(m=>`<div class="c">${QQ_MASCOT.kid(b,m)}${b} · ${m}</div>`).join('')).join('');</script>
