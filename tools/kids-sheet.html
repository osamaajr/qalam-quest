<!doctype html><meta charset="utf-8"><title>Kids activity sheet</title>
<link rel="stylesheet" href="../css/mascot.css">
<style>body{font-family:sans-serif;background:#f6f7fb;margin:0;padding:12px}.g{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:8px}.c{background:#fff;border-radius:12px;text-align:center;font-size:13px;padding:6px}.c .kid{width:100%;height:var(--h,260px)}</style>
<div class="g" id="g"></div>
<script src="../js/kids-vector.js"></script><script src="../js/mascot.js"></script>
<script>
// ?b=zaid|huda  ?only=reading,quran  ?t=ms (freeze every animation at that time)  ?h=px  ?cols=n
const q = new URLSearchParams(location.search);
const acts = (q.get('only') || ['idle', ...QQ_MASCOT.ACTIVITIES].join(',')).split(',');
const buds = (q.get('b') || 'zaid,huda').split(',');
if (q.get('h')) document.body.style.setProperty('--h', q.get('h') + 'px');
if (q.get('cols')) document.body.style.setProperty('--cols', q.get('cols'));
document.getElementById('g').innerHTML = buds.map(b => acts.map(m => `<div class="c">${QQ_MASCOT.kid(b, m)}${b} · ${m}</div>`).join('')).join('');
if (q.has('t')) setTimeout(() => { document.getAnimations().forEach(a => { a.pause(); a.currentTime = +q.get('t'); }); document.querySelectorAll('.kid').forEach(k => k.style.setProperty('--ph', '0s')); }, 900);
</script>
