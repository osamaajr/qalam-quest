<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Qalam</title>
  <meta name="description" content="A playful game that teaches children to read Qur’anic Arabic — letters, vowels, tajwīd and grammar.">
  <meta name="theme-color" content="#2B59FF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo/qalam-icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Naskh+Arabic:wght@500;700&family=Amiri:wght@400;700&family=Amiri+Quran&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mascot.css">
  <link rel="stylesheet" href="css/animals.css">
  <!-- both buddies appear on the first screens: fetch their pose sheets early so they never pop in late -->
  <link rel="preload" as="image" type="image/webp" href="assets/characters/zaid-poses.webp">
  <link rel="preload" as="image" type="image/webp" href="assets/characters/huda-poses.webp">
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('qalamquest.v1')||'{}');var t=(s.settings&&s.settings.theme)||'auto';var m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');var apply=function(){var d=t==='dark'||(t==='auto'&&m&&m.matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');document.querySelector('meta[name=theme-color]')&&document.querySelector('meta[name=theme-color]').setAttribute('content',d?'#131A2B':'#2B59FF');};apply();m&&m.addEventListener&&m.addEventListener('change',apply);window.__applyTheme=function(x){t=x;apply();};}catch(e){}})();</script>
</head>
<body>
  <div id="app"></div>
  <noscript>Qalam Quest needs JavaScript turned on.</noscript>
  <script src="js/arabic-text.js"></script>
  <script src="js/content.js"></script>
  <script src="js/audio-manifest.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/logo-component.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/app.js"></script>
  <script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
</html>
